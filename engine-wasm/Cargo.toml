[package]
name = "engine-wasm"
description = "wasm-bindgen bindings for the Coastal Agentics Arena engine (browser match viewer)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned exactly: the committed web/pkg glue must come from the same wasm-bindgen-cli version.
wasm-bindgen = "=0.2.100"
