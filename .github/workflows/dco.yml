name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Bot-authored commits (the project's agents) must carry the maintainer's own
          # sign-off and an Agent-Run trailer. Everyone else signs off as themselves.
          MAINTAINER_SIGNOFF: "Nye Warburton <7074155+NyeGuy@users.noreply.github.com>"
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            name=$(git show -s --format='%an' "$sha")
            author=$(git show -s --format='%an <%ae>' "$sha")
            signoffs=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")
            if printf '%s' "$name" | grep -q '\[bot\]'; then
              if ! printf '%s\n' "$signoffs" | grep -qxF "$MAINTAINER_SIGNOFF"; then
                echo "::error::commit $sha is bot-authored and has no maintainer Signed-off-by"; fail=1
              fi
              if ! git show -s --format='%(trailers:key=Agent-Run,valueonly)' "$sha" | grep -q .; then
                echo "::error::commit $sha is bot-authored and has no Agent-Run trailer"; fail=1
              fi
            elif ! printf '%s\n' "$signoffs" | grep -qxF "$author"; then
              echo "::error::commit $sha has no Signed-off-by matching its author ($author)"; fail=1
            fi
          done
          exit $fail
