name: Nightly self-play

# Publishes nightly results WITHOUT new credentials and WITHOUT touching protected main (ADR-007):
#   - results are committed to the unprotected `nightly-data` branch (never force-pushed)
#   - only web/data/ and docs/fieldnotes/ may change; anything else fails the job
#   - `nightly-data` merges main first, so a CoS PR `nightly-data -> main` shows only new results
#   - the site reads live nightly data from `nightly-data`; the CoS folds it into main by PR
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC = 3:00 AM America/New_York (EDT)
  workflow_dispatch:
    inputs:
      probe:
        description: "Write web/data/nightly.json to exercise the publish path end to end"
        type: boolean
        default: false

permissions:
  contents: write # push to nightly-data only (main is protected and rejects this token)

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  DATA_BRANCH: nightly-data

jobs:
  self-play:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Switch to data branch (create from main if missing) and merge main
        run: |
          # No email addresses in this public repo (charter): commit with an empty email.
          git config user.name "github-actions[bot]"
          git config user.email ""
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -B "$DATA_BRANCH" origin/main
          fi

      - name: Self-play evolution (placeholder)
        run: echo "self-play not yet implemented"
        # Phase 3: run evolution headless; write results to web/data/ and a field note to docs/fieldnotes/.

      - name: Probe output
        if: ${{ inputs.probe }}
        run: |
          mkdir -p web/data
          printf '{\n  "generation": 0,\n  "status": "self-play not yet implemented"\n}\n' > web/data/nightly.json

      - name: Commit results (allowed paths only)
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new results."
          else
            if git diff --cached --name-only | grep -vE '^(web/data/|docs/fieldnotes/)'; then
              echo "::error::Nightly may only change web/data/ and docs/fieldnotes/ (files above are outside)."
              exit 1
            fi
            git commit -m "nightly: results $(date -u +%Y-%m-%d) [run ${{ github.run_id }}]"
          fi

      - name: Push data branch (never force)
        run: git push origin "HEAD:refs/heads/$DATA_BRANCH"
