name: Nightly self-play

# Publishes nightly results WITHOUT new credentials and WITHOUT touching protected main (ADR-007):
#   - results are committed to the unprotected `nightly-data` branch (never force-pushed)
#   - only web/data/ and docs/fieldnotes/ may change; anything else fails the job
#   - `nightly-data` merges main first, so a CoS PR `nightly-data -> main` shows only new results
#   - the site reads live nightly data from `nightly-data`; the CoS folds it into main by PR
on:
  schedule:
    # 23:37 UTC = 7:37 PM America/New_York in summer (EDT), 6:37 PM in winter (EST).
    # Evening on purpose: GitHub has been delaying this cron 5-9 hours, so the old 2:37 AM
    # slot landed mid-morning (Oct 5: 11:11 AM ET), inside the founder's quiet window. An
    # evening start leaves room for long delays. The `hours` job below is the hard rule.
    # Off the top of the hour on purpose: GitHub delays congested round-hour crons by hours.
    # Late or manual runs queue behind each other via `concurrency` below (never cancelled).
    - cron: "37 23 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Write web/data/nightly.json to exercise the publish path end to end"
        type: boolean
        default: false

permissions:
  contents: write # push to nightly-data only (main is protected and rejects this token)

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  DATA_BRANCH: nightly-data

jobs:
  # Founder rule (2026-10-03): no runs or commits on weekdays 8 AM-5 PM America/New_York
  # (the founder's quiet window). A run may take up to an hour,
  # so nothing starts on a weekday from 7:00 AM to 4:59 PM ET. This applies to every event,
  # manual dispatch included. A skipped run is not a failure; the CoS dispatches it after 5 PM.
  hours:
    runs-on: ubuntu-24.04
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        run: |
          dow=$(TZ=America/New_York date +%u)
          hr=$((10#$(TZ=America/New_York date +%H)))
          now=$(TZ=America/New_York date '+%a %Y-%m-%d %H:%M %Z')
          if [ "$dow" -le 5 ] && [ "$hr" -ge 7 ] && [ "$hr" -lt 17 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: $now is inside the weekday 7 AM-5 PM ET quiet window (founder rule)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Allowed: $now is outside the weekday quiet window." >> "$GITHUB_STEP_SUMMARY"
          fi

  self-play:
    needs: hours
    if: needs.hours.outputs.ok == 'true'
    # Pinned, not ubuntu-latest: evolution results are only byte-identical on the same
    # platform (ADR-003), and each night resumes the last night's state.json.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Switch to data branch (create from main if missing) and merge main
        run: |
          # No email addresses in this public repo (charter): commit with an empty email.
          git config user.name "github-actions[bot]"
          git config user.email ""
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -B "$DATA_BRANCH" origin/main
          fi

      # GATE-003 M2: nightly evolution (docs/plans/GATE-003-nightly-spec.md). Publishes to
      # nightly-data only; the job never promotes a champion. A champion above 70% vs Gen 0
      # is HELD (status "experimental") and the CoS tells Nye (GATE-003 Resolved Q2).
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Self-play evolution (GATE-003 M1)
        run: |
          set -euo pipefail
          OUT=web/data/evolution
          mkdir -p "$OUT"
          RESUME=""
          if [ -f "$OUT/state.json" ]; then RESUME="--resume"; fi
          cargo run -p tank --release --locked --example evolve -- run \
            --out "$OUT" --seed 1 --generations 100 --minutes 30 \
            --threads "$(nproc)" --commit "$(git rev-parse HEAD)" $RESUME

      - name: Re-verify the champion by hash
        run: cargo run -p tank --release --locked --example evolve -- verify --out web/data/evolution --threads "$(nproc)"

      - name: Size caps and promotion status
        run: |
          set -euo pipefail
          OUT=web/data/evolution
          total=$(cat "$OUT"/*.json | wc -c)
          if [ "$total" -gt 5000000 ]; then echo "::error::$OUT is $total B (cap 5 MB)"; exit 1; fi
          git add -A web/data
          changed=$(git diff --cached --name-only --diff-filter=d -- web/data | xargs -r cat | wc -c)
          if [ "$changed" -gt 200000 ]; then echo "::error::nightly change is $changed B (cap 200 KB)"; exit 1; fi
          status=$(jq -r .held_out.status "$OUT/champion.json")
          label=$(jq -r .label "$OUT/champion.json")
          gen=$(jq -r .generation "$OUT/champion.json")
          rate=$(jq -r .held_out.win_rate "$OUT/champion.json")
          echo "Gen $gen champion $label: $rate vs Gen 0 on 1,000 held-out seeds, status $status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = "experimental" ]; then
            echo "::warning::Gen $gen ($label) wins $rate vs the scripted field (> 70%): HELD from promotion, labeled experimental. CoS: tell Nye."
          fi

      - name: Probe output
        if: ${{ inputs.probe }}
        run: |
          mkdir -p web/data
          printf '{\n  "generation": 0,\n  "status": "self-play not yet implemented"\n}\n' > web/data/nightly.json

      - name: Commit results (allowed paths only)
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new results."
          else
            if git diff --cached --name-only | grep -vE '^(web/data/|docs/fieldnotes/)'; then
              echo "::error::Nightly may only change web/data/ and docs/fieldnotes/ (files above are outside)."
              exit 1
            fi
            git commit -m "nightly: results $(date -u +%Y-%m-%d) [run ${{ github.run_id }}]"
          fi

      - name: Push data branch (never force)
        run: git push origin "HEAD:refs/heads/$DATA_BRANCH"
