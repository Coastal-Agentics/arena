name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    # Pinned: the tests compare pinned match and state hashes (ADR-003: same platform).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace
      - name: headless smoke (10 matches)
        run: cargo run -p engine-cli -- --matches 10 --seed 42

  wasm:
    name: wasm
    # Pinned: rebuilt web/pkg must byte-match the committed copy, and the viewer check
    # uses the image's /usr/bin/google-chrome.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
      - name: wasm build check
        run: cargo build -p engine --target wasm32-unknown-unknown
      # web/pkg is committed and deployed as-is (ADR-008). Rebuild it from source with the
      # pinned toolchain and wasm-bindgen-cli, and fail if it differs from the committed copy.
      - name: Cache wasm-bindgen-cli
        id: wbg-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-cli-0.2.100-${{ runner.os }}
      - name: Install wasm-bindgen-cli 0.2.100
        if: steps.wbg-cache.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version 0.2.100
      - name: Rebuild web/pkg (builds engine-wasm)
        run: |
          wasm-bindgen --version
          ./scripts/build-wasm.sh
      - name: web/pkg matches committed copy
        run: |
          git status --short -- web/pkg
          git diff --exit-code --stat -- web/pkg || {
            echo "::error::web/pkg is stale or not reproducible. Run ./scripts/build-wasm.sh with the pinned toolchain and wasm-bindgen-cli 0.2.100, then commit web/pkg."
            exit 1
          }
          test -z "$(git status --porcelain -- web/pkg)"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      # Fieldnote cards (web/fieldnotes/cards/*.json) are validated on every PR; Pages
      # generates web/fieldnotes/index.json from them at deploy time (it is gitignored).
      - name: Fieldnote cards (validate + tests)
        run: |
          node scripts/fieldnotes_index.mjs --check
          node --test scripts/fieldnotes_index.test.mjs
      - name: Build catalog JS exports (racing)
        run: node --test scripts/catalog_racing.test.mjs
      - name: Native-vs-wasm parity (pinned replays)
        run: |
          node --version
          node scripts/check-parity.mjs || {
            echo "::error::web/pkg disagrees with the natively recorded manifest in engine-wasm/tests/parity/. See docs/engine/determinism.md (Native-vs-wasm parity)."
            exit 1
          }
      - name: Browser viewer check
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --disable-pip-version-check playwright
          test -x /usr/bin/google-chrome
          CHROME=/usr/bin/google-chrome .ci-venv/bin/python scripts/check-viewer-browser.py
