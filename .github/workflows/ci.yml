name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace
      - name: headless smoke (10 matches)
        run: cargo run -p engine-cli -- --matches 10 --seed 42

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
      - name: wasm build check
        run: cargo build -p engine --target wasm32-unknown-unknown
      # web/pkg is committed and deployed as-is (ADR-008). Rebuild it from source with the
      # pinned toolchain and wasm-bindgen-cli, and fail if it differs from the committed copy.
      - name: Cache wasm-bindgen-cli
        id: wbg-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-cli-0.2.100-${{ runner.os }}
      - name: Install wasm-bindgen-cli 0.2.100
        if: steps.wbg-cache.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version 0.2.100
      - name: Rebuild web/pkg (builds engine-wasm)
        run: |
          wasm-bindgen --version
          ./scripts/build-wasm.sh
      - name: web/pkg matches committed copy
        run: |
          git status --short -- web/pkg
          git diff --exit-code --stat -- web/pkg || {
            echo "::error::web/pkg is stale or not reproducible. Run ./scripts/build-wasm.sh with the pinned toolchain and wasm-bindgen-cli 0.2.100, then commit web/pkg."
            exit 1
          }
          test -z "$(git status --porcelain -- web/pkg)"
      - name: Browser viewer check
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --disable-pip-version-check playwright
          test -x /usr/bin/google-chrome
          CHROME=/usr/bin/google-chrome .ci-venv/bin/python scripts/check-viewer-browser.py
