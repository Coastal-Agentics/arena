name: Pages

# Deploys web/ as static files to GitHub Pages on push to main (ADR-008).
# The wasm and its JS glue are committed under web/pkg. The only build step generates the
# gitignored web/fieldnotes/index.json from web/fieldnotes/cards/*.json (#52).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Generate web/fieldnotes/index.json
        run: |
          node --version
          node scripts/fieldnotes_index.mjs
          test -s web/fieldnotes/index.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
