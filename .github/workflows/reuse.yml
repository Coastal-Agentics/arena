name: reuse

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: REUSE lint
        run: |
          python -m pip install "reuse[charset-normalizer]==6.2.0"
          reuse lint
