[package]
name = "engine-py"
description = "Python bindings for the arena games (tank, racing): the saltmarsh-arena wheel, built with maturin"
# Not a member of the root workspace (it excludes this crate): kept in step with it by hand.
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Coastal-Agentics/arena"
publish = false

# Its own workspace, Cargo.lock and target/: the root workspace never sees pyo3.
# `tests/lock.rs` checks every crate both lockfiles share has the same version.
[workspace]

[lib]
# The Python module is `saltmarsh_arena._core` (see pyproject.toml).
name = "engine_py"
crate-type = ["cdylib", "rlib"]

[features]
# Off by default: `cargo test` here builds only the pure-Rust session core, with no
# Python. maturin turns `python` on (pyproject.toml) and sets
# PYO3_BUILD_EXTENSION_MODULE itself, so pyo3's deprecated `extension-module` feature
# is not used.
default = []
python = ["dep:pyo3"]

[dependencies]
engine = { path = "../engine" }
tank = { path = "../games/tank" }
racing = { path = "../games/racing" }
game-catalog = { path = "../games/catalog" }
pyo3 = { version = "0.29", optional = true, default-features = false, features = ["macros", "abi3-py310"] }

[dev-dependencies]
serde_json = "1"
