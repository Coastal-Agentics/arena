[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "saltmarsh-arena"
description = "The arena's deterministic Rust games (Tank Arena, Racing) as PettingZoo and Gymnasium environments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Coastal Agentics" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
# Thin by default: numpy only. FlatEnv, the catalog calls and verify_replay need
# nothing else; the envs are extras, imported only when used.
dependencies = ["numpy>=1.24"]
dynamic = ["version"]

[project.optional-dependencies]
gym = ["gymnasium>=1.0,<2"]
pettingzoo = ["pettingzoo>=1.24,<2", "gymnasium>=1.0,<2"]
all = ["saltmarsh-arena[gym,pettingzoo]"]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/Coastal-Agentics/arena"

[tool.maturin]
# Mixed layout: the pure-Python package in python/, the Rust module at
# saltmarsh_arena._core. Only maturin turns on pyo3 (the root workspace excludes this crate).
python-source = "python"
module-name = "saltmarsh_arena._core"
features = ["python"]
profile = "release"
include = [{ path = "LICENSE", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
