<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Customizer moved into the Nyborg app · Arena · Coastal Agentics</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="./play/">
  <!-- The Customizer is now the Nyborg app's editor (docs/design/nyborg-app.md, milestone 4).
       Same Nyborgs, same browser storage. This page forwards to your selected Nyborg's editor. -->
  <script>
    (function () {
      var hash = "#/";
      try {
        var index = JSON.parse(localStorage.getItem("arena.nyborg.index") || "null");
        if (index && index.selected) hash = "#/nyborg/" + encodeURIComponent(index.selected);
      } catch (e) { /* storage blocked: go home */ }
      location.replace("./play/" + hash);
    })();
  </script>
  <meta http-equiv="refresh" content="1; url=./play/">
</head>
<body>
  <p>The Customizer moved into the <a href="./play/">Nyborg app</a>. Same Nyborgs, same browser.</p>
</body>
</html>
