[package]
name = "tank"
description = "Tank Arena rules, observations, actions and policies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
engine = { path = "../../engine" }
# Seeded policy jitter; no default features so wasm32-unknown-unknown builds (as in engine).
rand_chacha = { version = "0.9", default-features = false }
# Evolution files (GATE-003 M1); already an engine dependency.
serde_json = "1"
