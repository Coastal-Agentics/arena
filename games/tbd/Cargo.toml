[package]
name = "tbd"
description = "TBD flight assist, mode machine and stair-hop mission: a physics sim with estimated parameters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Same generator and seed function as engine::MatchRng. No default features, so
# wasm32-unknown-unknown builds (no OS entropy).
rand_chacha = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
